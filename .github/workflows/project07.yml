name: Nand2Tetris Project 07
on:
  push:
    branches: [edidada/project07]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-24.07
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build official simulator and test assembly programs
        run: |
          set -o pipefail
          bash scripts/run_project07.sh 07 2>&1 | tee project07-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project07-official-results
          path: project07-results.txt
