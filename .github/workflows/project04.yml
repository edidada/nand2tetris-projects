name: Nand2Tetris Project 04
on:
  push:
    branches: [edidada/project04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build official simulator and test assembly programs
        run: |
          set -o pipefail
          bash scripts/run_project04.sh 04 2>&1 | tee project04-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project04-official-results
          path: project04-results.txt
