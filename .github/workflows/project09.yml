name: Nand2Tetris Project09 Sokoban
on:
  push:
    branches: [edidada/project09]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/run_project09.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project09-results
          path: test-results/
