name: Nand2Tetris Project 06
on:
  push:
    branches: [edidada/project06]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assembler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: projects/06
        run: python -m unittest -v test_assembler
