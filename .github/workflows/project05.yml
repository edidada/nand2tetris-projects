name: Nand2Tetris Project 05
on:
  push:
    branches: [edidada/project05]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build official simulator and test all chips
        run: |
          set -o pipefail
          bash scripts/run_project01.sh 05 2>&1 | tee project05-results.txt
      - name: Run original Memory test with GUI keyboard events
        run: bash scripts/verify_project05_gui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project05-official-results
          path: |
            project05-results.txt
            test-results/
